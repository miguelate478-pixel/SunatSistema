name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sunat_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sunat_platform_test?schema=public
      JWT_SECRET: ci-test-secret-key-minimum-32-characters
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
      STORAGE_PROVIDER: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        run: npm run db:migrate:deploy

      - name: Seed test data
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        # Tests require running server — skip in CI for now
        # TODO: add integration test server startup
        continue-on-error: true
